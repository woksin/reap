[package]
name = "reap"
version = "0.1.0"
edition = "2024"
description = "Interactive TUI for finding and pruning stale developer junk"
license = "MIT"
repository = "https://github.com/woksin/reap"

[dependencies]
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3"

[profile.release]
opt-level = 3
lto = true
strip = true
