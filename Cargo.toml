[package]
name = "reap"
version = "1.0.0"
edition = "2024"
# Let-chains, which this crate uses throughout, are stable from here. The README
# advertises the same floor; this is what actually holds it.
rust-version = "1.88"
description = "Interactive TUI for finding and pruning stale developer junk"
license = "MIT"
repository = "https://github.com/woksin/reap"
readme = "README.md"
keywords = ["tui", "disk-usage", "cleanup", "git", "docker"]
categories = ["command-line-utilities", "filesystem", "development-tools"]

[dependencies]
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3"

[profile.release]
opt-level = 3
lto = true
strip = true
# Whole-program optimisation across a single unit. Pairs with `lto`, and this
# binary is small enough that the longer link is not worth arguing about.
codegen-units = 1

[lints.rust]
# A tool that deletes files should have to justify reaching for `unsafe` in the
# diff rather than in a review comment. `deny` rather than `forbid` so the one
# place that genuinely needs it — the Win32 call for free disk space — can say
# so in place, with its reason; `forbid` cannot be excepted at all.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# --- deliberate exemptions ---------------------------------------------------
# Each of these is a lint we disagree with here, not one we have yet to get to.
# Anything not listed is expected to be clean, so `-D warnings` in CI holds the
# line without anyone having to remember it.

# Rewriting `if let ... else` as `map_or_else` moves the common path into a
# closure and the fallback out of line. In the places this fires it reads worse.
option_if_let_else = "allow"
# The module tree is private already; `pub(crate)` on top of that is how we say
# "another module uses this" at the item, which is worth keeping visible.
redundant_pub_crate = "allow"
# `Cli` is a flag list. Grouping unrelated switches into a struct to please a
# count would obscure what the command line actually accepts.
struct_excessive_bools = "allow"
# A binary has no downstream callers to warn, so `#[must_use]` buys nothing.
must_use_candidate = "allow"
