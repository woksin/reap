<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="reap — know what is safe to lose">
  <title>reap — know what is safe to lose</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131b24"/>
    </linearGradient>
    <clipPath id="mark-tile">
      <rect x="0" y="0" width="128" height="128" rx="27"/>
    </clipPath>
    <clipPath id="mark-kept">
      <path d="M 118 -8 Q 76 58 50 136 L -8 136 L -8 -8 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="960" height="280" rx="24" fill="url(#bg)"/>

  <!-- The mark, identical in construction to assets/logo.svg. -->
  <g transform="translate(64, 76)">
    <g clip-path="url(#mark-tile)">
      <rect x="0" y="0" width="128" height="128" fill="#0f1620"/>
      <g fill="#1c2430">
        <rect x="18" y="29" width="86" height="13" rx="6.5"/>
        <rect x="18" y="50" width="62" height="13" rx="6.5"/>
        <rect x="18" y="71" width="92" height="13" rx="6.5"/>
        <rect x="18" y="92" width="48" height="13" rx="6.5"/>
      </g>
      <g clip-path="url(#mark-kept)">
        <rect x="18" y="29" width="86" height="13" rx="6.5" fill="#7dd3fc"/>
        <rect x="18" y="50" width="62" height="13" rx="6.5" fill="#7ee7db"/>
        <rect x="18" y="71" width="92" height="13" rx="6.5" fill="#86efac"/>
        <rect x="18" y="92" width="48" height="13" rx="6.5" fill="#fcbf7a"/>
      </g>
      <path d="M 118 -8 Q 76 58 50 136" fill="none" stroke="#0f1620" stroke-width="12"/>
      <path d="M 118 -8 Q 76 58 50 136" fill="none" stroke="#dcfce7" stroke-width="4"/>
    </g>
    <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="26.25" fill="none" stroke="#263041" stroke-width="1.5"/>
  </g>

  <!-- Monospace, because the thing it names lives in a terminal. -->
  <text x="248" y="150"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="88" font-weight="700" fill="#e6edf3" letter-spacing="-3">reap</text>

  <text x="252" y="192"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="24" fill="#7dd3fc">know what is safe to lose</text>

  <text x="252" y="222"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="15" fill="#6e7681">git · worktrees · build artifacts · docker · caches</text>

  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="23.25" fill="none" stroke="#21262d" stroke-width="1.5"/>
</svg>
